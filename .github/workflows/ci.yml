name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: maven:3.9.6-eclipse-temurin-21
    steps:
      - uses: actions/checkout@v3
      - name: Set up Maven
        run: chmod +x mvnw || true
      - name: Build with Maven
        run: mvn clean package -DskipTests=false
      - name: Upload JAR
        uses: actions/upload-artifact@v3
        with:
          name: app-jar
          path: ./target/*.jar

