workflow:
  rules:
    - if: $CI_MERGE_REQUEST_IID   # запускать только на Merge Request

stages:
  - build

build-job:
  stage: build
  tags:
    - saas-linux-small-amd64
  image: maven:3.9.6-eclipse-temurin-21
  script:
    - mvn clean package -DskipTests=false
  artifacts:
    paths:
      - ./target/*.jar
    expire_in: 1 week

