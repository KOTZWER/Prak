workflow:
  rules:
    - if: $CI_MERGE_REQUEST_IID   # запускать только на Merge Request

stages:
  - build
  - test

build-job:
  stage: build
  tags:
    - saas-linux-small-amd64
  image: maven:3.9.6-eclipse-temurin-21
  script:
    - mvn clean package -DskipTests=false
  artifacts:
    paths:
      - ./target/*.jar
    expire_in: 1 week

# Добавляем SAST этап
sast-job:
  stage: test
  image: returntocorp/semgrep:latest
  script:
    - semgrep --config=p/ci --sarif --output=gl-sast-report.sarif
  artifacts:
    reports:
      sast: gl-sast-report.sarif
    expire_in: 1 week

